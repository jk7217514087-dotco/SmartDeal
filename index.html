<!doctype html>
<html lang="en" data-theme="pure-white">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/smartdeal.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/smartdeal_app_icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/smartdeal_app_icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SmartDeal" />
    <meta name="application-name" content="SmartDeal" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>SmartDeal - Smart Shopping. Better Deals. Every Time.</title>
    <meta name="description" content="Intelligent e-commerce and price comparison platform. Compare live prices across Amazon, Flipkart, Croma, check real final payable price, Deal Score, earn SmartCoins rewards." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      window.__smartdeal_start_time = Date.now();
      window.__smartdeal_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__smartdeal_deferred_prompt = e;
        window.dispatchEvent(new CustomEvent('smartdeal-prompt-ready', { detail: e }));
      });
      (function() {
        try {
          var theme = 'pure-white';
          var bg = '#FFFFFF';
          document.documentElement.setAttribute('data-theme', 'pure-white');
          document.documentElement.style.setProperty('--smartdeal-bg', '#FFFFFF');
          document.documentElement.style.backgroundColor = '#FFFFFF';
          document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white min-h-screen text-slate-900" style="background-color: #FFFFFF;">
    <!-- Standalone & Web Rotating Splash Loader Overlay (Phone Screen & Laptop Ready) -->
    <div id="smartdeal-splash-screen" style="
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 999999;
      padding: 24px;
      text-align: center;
      user-select: none;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s ease;
    ">
      <style>
        @keyframes sd-spin-ring {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes sd-pulse-glow {
          0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(99,102,241,0.45)); }
          50% { transform: scale(1.03); filter: drop-shadow(0 0 32px rgba(168,85,247,0.75)); }
        }
        @keyframes sd-progress-bar {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(10%); }
          100% { transform: translateX(100%); }
        }
        .sd-rotating-loader {
          position: absolute;
          inset: -9px;
          border-radius: 30px;
          border: 3.5px solid rgba(255, 255, 255, 0.08);
          border-top-color: #6366f1;
          border-right-color: #ec4899;
          border-bottom-color: #06b6d4;
          border-left-color: #a855f7;
          animation: sd-spin-ring 1.1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }
        .sd-rotating-loader::after {
          content: '';
          position: absolute;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #38bdf8;
          top: -5px;
          left: 50%;
          transform: translateX(-50%);
          box-shadow: 0 0 14px #38bdf8, 0 0 24px #0ea5e9;
        }
        /* Light mode support */
        html:not(.dark) #smartdeal-splash-screen {
          background: #f8fafd !important;
          color: #0f172a !important;
        }
        html:not(.dark) #sd-splash-title {
          background: linear-gradient(135deg, #0f172a 30%, #4338ca 70%, #7e22ce 100%) !important;
          -webkit-background-clip: text !important;
          -webkit-text-fill-color: transparent !important;
        }
        html:not(.dark) #sd-splash-msg {
          color: #475569 !important;
        }
        html:not(.dark) .sd-logo-container {
          background: #ffffff !important;
          box-shadow: 0 12px 30px rgba(0,0,0,0.12) !important;
        }
        html:not(.dark) .sd-progress-track {
          background: rgba(0,0,0,0.08) !important;
        }
        html:not(.dark) .sd-sub-note {
          color: #64748b !important;
        }
      </style>

      <!-- Center Icon with Rotating Neon Border -->
      <div style="position: relative; width: 96px; height: 96px; margin-bottom: 26px;">
        <!-- Spinning Gradient Ring -->
        <div class="sd-rotating-loader"></div>
        <!-- App Logo Squircle -->
        <div class="sd-logo-container" style="
          width: 100%;
          height: 100%;
          border-radius: 24px;
          overflow: hidden;
          box-shadow: 0 12px 35px rgba(0,0,0,0.55);
          animation: sd-pulse-glow 2.5s ease-in-out infinite;
          background: #00061e;
          display: flex;
          align-items: center;
          justify-content: center;
        ">
          <img src="/smartdeal_app_icon.png" alt="SmartDeal" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
      </div>

      <!-- Brand Name with Gradient -->
      <div style="margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span id="sd-splash-title" style="font-size: 28px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #ffffff 30%, #818cf8 70%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          SmartDeal
        </span>
        <span style="display: inline-block; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 7px; background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.45); color: #a5b4fc; letter-spacing: 0.5px;">
          PRO
        </span>
      </div>

      <!-- Rotating Status Messages for Slow Internet -->
      <div id="sd-splash-msg" style="
        font-size: 13px;
        font-weight: 600;
        color: #94a3b8;
        min-height: 22px;
        margin-bottom: 22px;
        transition: opacity 0.3s ease;
        max-width: 300px;
      ">
        Connecting & Loading Best Deals...
      </div>

      <!-- Animated Progress Sweeper Bar -->
      <div class="sd-progress-track" style="width: 190px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; position: relative;">
        <div style="width: 100%; height: 100%; background: linear-gradient(90deg, transparent 0%, #6366f1 50%, #06b6d4 100%); border-radius: 999px; animation: sd-progress-bar 1.5s ease-in-out infinite;"></div>
      </div>

      <!-- Offline / Slow connection reassurance note -->
      <div class="sd-sub-note" style="margin-top: 18px; font-size: 11px; color: #64748b; font-weight: 500;">
        Live Price Comparison Engine
      </div>

      <script>
        (function() {
          try {
            var messages = [
              "Connecting to live marketplace servers...",
              "Loading Amazon, Flipkart & Croma deals...",
              "Syncing verified discounts & coupons...",
              "Slow network detected - keeping connection open...",
              "Opening SmartDeal, almost ready..."
            ];
            var idx = 0;
            var msgEl = document.getElementById("sd-splash-msg");
            if (msgEl) {
              if (navigator && navigator.onLine === false) {
                msgEl.textContent = "Offline mode - waiting for internet...";
              }
              setInterval(function() {
                if (navigator && navigator.onLine === false) {
                  msgEl.textContent = "Offline mode - waiting for internet...";
                  return;
                }
                idx = (idx + 1) % messages.length;
                msgEl.style.opacity = '0';
                setTimeout(function() {
                  msgEl.textContent = messages[idx];
                  msgEl.style.opacity = '1';
                }, 250);
              }, 2200);
            }

            // Fallback safety: ensure splash screen automatically fades out after 10s if React is blocked
            setTimeout(function() {
              var splash = document.getElementById("smartdeal-splash-screen");
              if (splash) {
                splash.style.opacity = '0';
                splash.style.pointerEvents = 'none';
                setTimeout(function() {
                  if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                }, 500);
              }
            }, 10000);
          } catch (e) {}
        })();
      </script>
    </div>

    <!-- Main React App Mount Container -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
