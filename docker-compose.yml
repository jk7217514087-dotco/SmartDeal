version: '3.8'

services:
  smartdeals-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdeals-web
    restart: always
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - smartdeals-db

  smartdeals-db:
    image: postgres:16-alpine
    container_name: smartdeals-db
    restart: always
    environment:
      POSTGRES_DB: smartdeals
      POSTGRES_USER: smartdeals_user
      POSTGRES_PASSWORD: smartdeals_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
    driver: local
